# Drift-eval (§8b) port — conditions and the cRSSM checkpoint inventory.
#
# Condition ids are CWM's (benchmark/eval_conditions.yaml:143/:154 @befabde, families dmc_drift_*; the
# training-protocol condition is CWM's `phys_train`). Letters A-F are the plan's names (§8b/§8c).
#
# Checkpoint facts [verified 2026-09-14]: `step` is the pickled step counter inside checkpoint.ckpt
# (read with pickle under /home/jovyan/envs/dali/bin/python); `sha256` is of the local file under
# /home/jovyan/baseline_ckpts/crssm/<slug>/seed<N>/checkpoint.ckpt and equals the LFS sha256 that
# HF `ssubhnil/cwm` lists for crssm/<slug>/seed<N>/checkpoint.ckpt (huggingface_hub list_repo_tree).
# run.py refuses a checkpoint whose sha256 is not listed here, and one whose step is not 1000000
# unless --allow-partial-ckpt.

conditions:
  phys_train:     {letter: A,  schedule: null,    axis: physics, what: "training protocol: regime B, train split, Bernoulli per-factor switching, per-episode lambda ~ U[0.003, 0.008] (checkpoint config)"}
  drift_ir_a:     {letter: B,  schedule: ir_a,    axis: drift,   what: "in-range matched abrupt (value-matched band permutation of IR-S, same TV)"}
  drift_ir_s:     {letter: C,  schedule: ir_s,    axis: drift,   what: "in-range gradual log-sine, one cycle, TV = training budget"}
  drift_h_a:      {letter: D,  schedule: h_a,     axis: drift,   what: "hard-excursion matched abrupt"}
  drift_h_s:      {letter: E,  schedule: h_s,     axis: drift,   what: "hard-excursion gradual half-cycle"}
  drift_tau_1:    {letter: F,  schedule: tau_1,   axis: drift,   what: "tau-dial (optional)"}
  drift_tau_8:    {letter: F,  schedule: tau_8,   axis: drift,   what: "tau-dial (optional)"}
  drift_tau_16:   {letter: F,  schedule: tau_16,  axis: drift,   what: "tau-dial (optional)"}
  drift_tau_64:   {letter: F,  schedule: tau_64,  axis: drift,   what: "tau-dial (optional)"}
  drift_tau_256:  {letter: F,  schedule: tau_256, axis: drift,   what: "tau-dial (optional)"}

default_conditions: [phys_train, drift_ir_a, drift_ir_s, drift_h_a, drift_h_s]

